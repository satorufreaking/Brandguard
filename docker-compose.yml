services:
  brandguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/brandguard
      - LLM_PROVIDER=deterministic
      # Optional Live AI Keys:
      # - OPENAI_API_KEY=your_openai_key
      # - GEMINI_API_KEY=your_gemini_key
      # - ANTHROPIC_API_KEY=your_anthropic_key
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
